name: Deploy changed sites

on:
  push:
    branches: [main]

# Serialize deploys. cancel-in-progress=false queues the latest push behind a
# running deploy. Intermediate pushes may be skipped by GitHub, which is safe
# because we always diff from the last-deployed tag, not from event.before.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

permissions:
  contents: write   # needed to move the last-deployed tag

env:
  FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: needed for the tag + diff

      # ---------- 1. Base = last successfully deployed commit ----------
      - name: Resolve diff base
        id: base
        run: |
          if git rev-parse -q --verify refs/tags/last-deployed >/dev/null; then
            echo "sha=$(git rev-parse last-deployed)" >> "$GITHUB_OUTPUT"
          else
            # First ever run: diff against the empty tree => everything changed
            echo "sha=$(git hash-object -t tree /dev/null)" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 2. Compute which campaigns changed ----------
      # Campaigns are top-level folders with a package.json, EXCEPT `shared`
      # (the common code package). If `shared` or the root workspace files
      # change, EVERY campaign must rebuild because they all consume it.
      - name: Compute changed campaigns
        id: changed
        run: |
          # nullglob: an unmatched glob expands to nothing (so empty campaigns/
          # doesn't leave a literal 'campaigns/*/'). The `|| true` guards keep a
          # final non-zero test from tripping `set -e` inside $(...).
          shopt -s nullglob
          BASE="${{ steps.base.outputs.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed paths:"; echo "$CHANGED"

          # All campaign folders live under campaigns/ and have a package.json
          ALL_CAMPAIGNS=$(for d in campaigns/*/; do
            d="${d%/}"
            [ -f "$d/package.json" ] && echo "$d"
          done || true)

          # Did shared code or the workspace root change? -> rebuild everything.
          # `shared` and `shared2` are both template packages consumed by
          # campaigns (selected per-campaign via campaign.config.json's
          # `template` field), so a change to either must rebuild all campaigns.
          GLOBAL_CHANGE=""
          if echo "$CHANGED" | grep -qE '^(shared/|shared2/|package\.json$|package-lock\.json$)'; then
            GLOBAL_CHANGE="yes"
            echo "Shared/root changed -> rebuilding ALL campaigns."
          fi

          if [ -n "$GLOBAL_CHANGE" ]; then
            FOLDERS="$ALL_CAMPAIGNS"
          else
            # Only campaigns/<name> folders that were directly touched
            DIRS=$(echo "$CHANGED" | grep '^campaigns/' | cut -d/ -f1-2 | sort -u || true)
            FOLDERS=$(for d in $DIRS; do
              [ -f "$d/package.json" ] && echo "$d"
            done || true)
          fi

          # Sites whose firebase.json entry was added or modified (config-only change)
          CONFIG_SITES=""
          if echo "$CHANGED" | grep -qx 'firebase.json'; then
            if git cat-file -e "$BASE:firebase.json" 2>/dev/null; then
              git show "$BASE:firebase.json" > /tmp/old.json
            else
              echo '{"hosting":[]}' > /tmp/old.json
            fi
            CONFIG_SITES=$(jq -n \
              --slurpfile old /tmp/old.json \
              --slurpfile new firebase.json \
              '[$new[0].hosting[] as $e
                | select(([$old[0].hosting[]] | index($e)) | not)
                | $e.site] | .[]' -r || true)
          fi

          # Map each affected campaign folder to its Firebase site id
          FOLDER_SITES=$(for d in $FOLDERS; do
            jq -r --arg d "$d" '.hosting[] | select(.public | startswith($d)) | .site' firebase.json
          done || true)

          SITES=$(printf '%s\n%s\n' "$FOLDER_SITES" "$CONFIG_SITES" | sed '/^$/d' | sort -u)
          FOLDERS=$(echo "$FOLDERS" | sed '/^$/d' | sort -u | paste -sd' ' -)

          echo "folders=$FOLDERS" >> "$GITHUB_OUTPUT"
          if [ -z "$SITES" ]; then
            echo "only=" >> "$GITHUB_OUTPUT"
            echo "No site changes - nothing to deploy."
          else
            ONLY=$(echo "$SITES" | sed 's/^/hosting:/' | paste -sd, -)
            echo "only=$ONLY" >> "$GITHUB_OUTPUT"
            echo "Will build: $FOLDERS"
            echo "Will deploy: $ONLY"
          fi

      # ---------- 3. Node setup + install the whole workspace ----------
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.only != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build affected campaigns
        if: steps.changed.outputs.only != ''
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          # One install at the root resolves every workspace (shared + campaigns).
          # `npm install` (not `npm ci`): campaigns are committed by the CMS without
          # regenerating package-lock.json, so the lock is reconciled here instead.
          npm install --no-audit --no-fund
          for d in ${{ steps.changed.outputs.folders }}; do
            echo "▶ Building campaign: $d"
            npm run build --workspace="$d"
          done

      # ---------- 4. Deploy only those sites ----------
      - name: Deploy
        if: steps.changed.outputs.only != ''
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID secret is not set - cannot resolve the Firebase project to deploy to."
            exit 1
          fi
          [ -f .firebaserc ] && sed -i "s|__FIREBASE_PROJECT_ID__|$FIREBASE_PROJECT_ID|g" .firebaserc || true
          npm i -g firebase-tools
          printf '%s' '${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy \
            --only "${{ steps.changed.outputs.only }}" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      # ---------- 5. Advance the marker only after success ----------
      - name: Move last-deployed tag
        if: success()
        run: |
          git tag -f last-deployed "${{ github.sha }}"
          git push -f origin last-deployed
